name = "daily-trends"
title = "每日技术趋势 · 发布"
description = "抓取当日行业热点与 GitHub 热门仓库，撰写中英双语内容，渲染并发布到个人网站。"
date_mode = "today"
timezone = "Asia/Shanghai"

# Two locks: one for the task itself, one for the site repo. The site lock is
# what keeps a manual run and the scheduled run from writing the same checkout.
lock_scope = ["task", "site"]

allowed_tools = [
  "fs_read", "fs_write", "fs_list", "fs_exists",
  "shell_run", "http_get", "http_probe", "notify",
  "codex_exec", "claude_exec",
]

readable_paths = ["{tools_dir}", "{site_repo}"]
writable_paths = ["{tools_dir}/data", "{site_repo}"]

[paths]
# Repository-local sibling defaults (relative to tasks/daily-trends), so a fresh
# checkout does not hard-code any one author's absolute home path. Override for
# a different layout without editing this file:
#   export DAILY_TRENDS_DIR=... SITE_REPO_DIR=...
tools_dir = "${DAILY_TRENDS_DIR:-../../../daily-trends}"
site_repo = "${SITE_REPO_DIR:-../../../个人网站}"

[context]
# What `--compose` defaults to for unattended runs.
compose_default = "llm"
provider = "deepseek"
prompt_dir = "prompts"
# Repair rounds if the model returns content that fails structure checks.
repair_rounds = 1

[publish]
# Disabled on purpose, for two reasons that outlive the divergence that first
# surfaced it.
#
# 1. Redundant. scripts/daily-trends.js generates trends/* during `hexo
#    generate`, and tools/deploy.sh in the blog repo ships the whole site -
#    verified: origin/main already carries trends/2026-09-25.
# 2. A second writer. This step commits trends pages straight into the 个人网站
#    checkout, and the blog build commits them via hexo. Two writers on one
#    branch is what produced the earlier 792-line deletion in
#    tech/papers/rrsi-harness-rsi. The checkout has since been re-synced
#    (backup branch: backup/pre-resync-20260926), but the conflict is structural.
#
# The hexo path is authoritative. To publish a day, run blog/tools/deploy.sh.
default_enabled = false
disabled_reason = "redundant with hexo deploy; keeping one writer on the Pages branch"
# 用 SSH 别名而不是 origin：本机网络策略会挡 github.com:443（api 与 SSH 正常），
# 这也是 daily-trends RUNBOOK 里使用的地址。
remote = "git@github-simonzj1:Simon-zj1/Simon-zj1.github.io.git"
branch = "main"
commit_message = "Daily trends: {date}"
add = ["trends", "css/trends.css", "tech/index.html", "sitemap.xml"]

[policy]
# Fail-closed. A reference that cannot be traced back to today's raw capture
# (CANNOT_VERIFY: the cited URL extends a real one, so the prefix is real but the
# remainder is unknown) must not reach a published page. The alternative,
# on_cannot_verify = "warn", records the uncertainty and continues.
on_fail = "block"
on_cannot_verify = "block"
on_abstain = "block"

[trigger]
type = "launchd"
label = "com.simonzj.agent.daily-trends"
publish = false
calendar = [{ hour = 23, minute = 0 }]

[[steps]]
id = "sync-site"
command = ["python3", "steps/15_sync_site.py"]
skip_on_dry_run = true
retries = 1
note = "把站点仓库同步到远端，避免在过期副本上渲染"

[[steps]]
id = "fetch"
command = ["python3", "steps/10_fetch.py"]
allow_degrade = true
timeout_sec = 1500
skip_on_dry_run = true
note = "抓取当日 raw 数据；代理或额度不可用时降级"

[[steps]]
id = "compose"
command = ["python3", "steps/20_compose.py"]
timeout_sec = 2400
note = "撰写中英双语内容（replay / llm / delegate）"

[[steps]]
id = "render"
command = ["python3", "steps/30_render.py"]
note = "归一化引用并渲染页面；dry-run 只产出预览"

[[steps]]
id = "publish"
command = ["python3", "steps/40_publish.py"]
when = "validation_passed"
requires_publish = true
note = "校验全部通过后才提交并推送站点仓库"

[[validators]]
name = "daily_trends_structure"
args = { path = "{run_dir}/content.json" }

[[validators]]
name = "daily_trends_references"
args = { path = "{run_dir}/content.json" }

[[validators]]
name = "daily_trends_verifiable"
args = { content_path = "{run_dir}/content.json", raw_path = "{tools_dir}/data/raw/{date}.json" }

# 同一篇里同一件事不能出现两次：硬重复（字符串可证）拦截，灰区相似只报数不判
# （闸门不调模型；要人工/模型判的话看 runs/<id>/dedup.json）。
[[validators]]
name = "daily_trends_no_duplicates"
args = { path = "{run_dir}/content.json" }

# 今日速读：页面顶部那 5 条能不能选出来。（阅读质量的门，不是发布的门。）
[[validators]]
name = "daily_trends_brief"
args = { path = "{run_dir}/content.json", tools_dir = "{tools_dir}", limit = 5 }

# 摘要深度：读得出「做法 + 边界」。只报警不拦发布——要修的是文案，不是停止发布。
[[validators]]
name = "daily_trends_depth"
args = { path = "{run_dir}/content.json", tools_dir = "{tools_dir}", min_ratio = 0.6 }
required = false

# 生成物漂移闸门：站点仓库里的 sitemap 必须始终可解析、无重复 URL、不累积空行。
[[validators]]
name = "sitemap_sane"
args = { path = "{site_repo}/sitemap.xml" }
