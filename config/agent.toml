# Local agent harness configuration.
#
# Secrets never live here: each provider names the environment variable that
# holds its key, and ~/.codex/.env is used as a fallback source.

[runtime]
default_provider = "deepseek"
default_executor = "codex"
# Commands that dry-run must not execute.
mutating_commands = ["git", "rm", "rsync", "cp", "mkdir", "touch"]

[budget]
run_timeout_sec = 5400
step_timeout_sec = 1800
step_retries = 1
# Hard monthly ceiling for paid-model runs. Cost is only measured when provider
# unit prices are set, so this is a lower bound, not a billing guarantee.
monthly_limit_usd = 20.0

[notify]
enabled = true
macos = true
webhook = ""
# failure | always
on = "failure"

[providers.deepseek]
type = "openai_compat"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-flash"
api_key_env = "DEEPSEEK_API_KEY"
timeout_sec = 300
max_retries = 2
temperature = 0.3
# Official DeepSeek pricing (2026-09-27): cache-miss input is $0.15/$0.30 per
# Mtok off-peak/peak; output is $0.60/$1.20. We use the peak cache-miss price
# as a conservative budget estimate. Cache-hit pricing is cheaper and is not
# modeled here, so this is an upper bound for normal calls, not a bill.
input_per_mtok = 0.30
output_per_mtok = 1.20

# Local model adapter (not used by default). M1 Pro / 16 GB realistically tops
# out around 7-14B quantised models, so this is for offline or sensitive runs.
[providers.local]
type = "openai_compat"
base_url = "http://127.0.0.1:11434/v1"
model = "qwen3:8b"
api_key_env = "LOCAL_API_KEY"
enabled = false

[executors.codex]
command = "codex"
sandbox = "workspace-write"
ephemeral = true
timeout_sec = 3600

[executors.claude]
command = "claude"
permission_mode = "acceptEdits"
timeout_sec = 3600

[tools.shell]
allowlist = [
  "python3", "git", "curl", "ls", "cp", "mkdir", "rm", "touch", "cat", "sed",
  "grep", "osascript", "codex", "claude", "plutil", "launchctl", "date", "rsync",
]
