name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # tomllib is standard library only from 3.11, so that is the real floor.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        # Some of these skip without a daily-trends checkout on disk (28 at the time of
        # writing); the rest run entirely from tests/fixtures so a fresh clone is testable.
        run: python3 -m unittest discover -t . -s tests -v

      - name: Validator probes
        # Fixture-driven and offline: hits the refund gate with payloads that
        # break its fail-closed invariant, and with payloads that must be allowed.
        run: ./agent verify probes

      - name: Verification eval on checked-in fixtures
        # Runs the URL matcher against a tiny two-day fixture corpus so the
        # matcher code is exercised even when the author's daily-trends checkout
        # is not present.
        run: |
          DAILY_TRENDS_DATA_DIR=tests/fixtures/verification/data \
            ./agent verify eval --corpus /tmp/agent-harness-fixture-corpus.json

      - name: PR guard smoke
        # Exercises the task end-to-end, including the three required
        # judgements. "." is a smoke scope; production callers should narrow it.
        run: |
          ./agent run pr-guard \
            --env AGENT_PR_RANGE=HEAD~1..HEAD \
            --env AGENT_PR_SCOPE=.

      - name: Refund guard smoke
        run: ./agent run refund-guard
