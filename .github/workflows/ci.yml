name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # tomllib is standard library only from 3.11, so that is the real floor.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Unit tests
        # 22 of these are skipped without a daily-trends capture on disk; the rest
        # run entirely from tests/fixtures so a fresh clone is testable.
        run: python3 -m unittest discover -t . -s tests -v

      - name: Validator probes
        # Fixture-driven and offline: hits the refund gate with payloads that
        # break its fail-closed invariant, and with payloads that must be allowed.
        run: ./agent verify probes
